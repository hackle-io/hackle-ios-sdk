name: update sdk version

on:
  create:
  workflow_call:
    inputs:
      branch:
        description: 'Dev branch to update (e.g. dev-4.2.0)'
        required: true
        type: string

jobs:
  create-dev-branch:
    if: inputs.branch != '' || (github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/dev-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Get branch name
        id: get_branch
        run: echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
        env:
          BRANCH_NAME: ${{ inputs.branch || github.ref_name }}

      - name: Extract version from branch name
        id: extract_version
        run: |
          BRANCH_NAME="${{ steps.get_branch.outputs.branch }}"
          # dev-*.*.*에서 버전 추출
          if [[ "$BRANCH_NAME" =~ ^dev-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          else
            echo "Not a dev-x.x.x branch"
            exit 1
          fi

      - name: Update iOS SDK
        run: |
          # pod 버전 업데이트
          sed -i -E 's/(spec\.version *=[[:space:]]*")[0-9]+\.[0-9]+\.[0-9]+(")/\1${{ steps.extract_version.outputs.version }}\2/' Hackle.podspec
          # package 버전업데이트
          sed -i -E 's/(static let CURRENT = ")[0-9]+\.[0-9]+\.[0-9]+(")/\1${{ steps.extract_version.outputs.version }}\2/' Sources/Hackle/Core/Utilities/SdkVersion.swift

      - name: Create release branches
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          MINOR_BRANCH="$(echo "$VERSION" | cut -d. -f1-2).x"

          MASTER_SHA=$(git rev-parse origin/master)

          for BRANCH in "release-$VERSION" "$MINOR_BRANCH"; do
            if git ls-remote --heads origin "$BRANCH" | grep -q .; then
              echo "$BRANCH already exists, skipping"
            else
              git push origin "$MASTER_SHA:refs/heads/$BRANCH"
              echo "Created $BRANCH at $MASTER_SHA"
            fi
          done

      - name: Push New Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update sdk version"
          git push origin
