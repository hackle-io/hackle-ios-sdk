name: update javascript sdk

on:
  schedule:
    - cron: '0 23 * * 0' # 매주 월요일 08:00 KST
  workflow_dispatch:

jobs:
  check-js-sdk-version:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
      js_sdk_version: ${{ steps.check.outputs.js_sdk_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check latest JS SDK version
        id: check
        run: |
          JS_SDK_VERSION=$(curl -sSf "https://registry.npmjs.org/-/package/@hackler%2Fjavascript-sdk/dist-tags" | jq -r '.latest')
          if [[ ! "$JS_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: js_sdk_version must be in X.Y.Z format: $JS_SDK_VERSION"
            exit 1
          fi
          echo "js_sdk_version=$JS_SDK_VERSION" >> $GITHUB_OUTPUT

          CURRENT=$(sed -n -E 's/.*static let javascriptSdkVersion = "([^"]+)".*/\1/p' Sources/Hackle/UI/InAppMessageUI/Views/Html/InAppMessageUIHtmlViewBridgeScript.swift)
          if [[ -z "$CURRENT" ]]; then
            echo "Error: Failed to parse current JS SDK version"
            exit 1
          fi
          echo "current: $CURRENT, latest: $JS_SDK_VERSION"

          if [[ "$CURRENT" == "$JS_SDK_VERSION" ]]; then
            echo "JS SDK is already up to date"
            echo "should_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git ls-remote --heads origin "update-javascript-sdk-$JS_SDK_VERSION" | grep -q .; then
            echo "Branch update-javascript-sdk-$JS_SDK_VERSION already exists"
            echo "should_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_update=true" >> $GITHUB_OUTPUT

  calculate-version:
    needs: check-js-sdk-version
    if: needs.check-js-sdk-version.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate next minor version
        id: version
        run: |
          CURRENT=$(sed -n -E 's/.*static let CURRENT = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Sources/Hackle/Core/Utilities/SdkVersion.swift)
          if [[ -z "$CURRENT" ]]; then
            echo "Error: Failed to parse current SDK version"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEXT_MINOR}.0"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  prepare-dev-branch:
    needs: calculate-version
    uses: ./.github/workflows/create_dev_branch.yml
    with:
      new_version: ${{ needs.calculate-version.outputs.new_version }}

  update-sdk-version:
    needs: prepare-dev-branch
    uses: ./.github/workflows/update_sdk_version.yml
    with:
      branch: ${{ needs.prepare-dev-branch.outputs.branch_name }}

  update-js-sdk:
    needs: [check-js-sdk-version, calculate-version, prepare-dev-branch]
    runs-on: ubuntu-latest
    env:
      JS_SDK_VERSION: ${{ needs.check-js-sdk-version.outputs.js_sdk_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-dev-branch.outputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download JS SDK from npm
        run: |
          npm pack "@hackler/javascript-sdk@$JS_SDK_VERSION" --pack-destination /tmp
          cd /tmp
          tar xzf hackler-javascript-sdk-*.tgz
          if [[ ! -f /tmp/package/lib/index.browser.umd.min.js ]]; then
            echo "Error: index.browser.umd.min.js not found in npm package"
            exit 1
          fi

      - name: Replace JS SDK file
        run: |
          cp /tmp/package/lib/index.browser.umd.min.js \
            "Sources/Hackle/Resources/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js"
          ls "Sources/Hackle/Resources/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js" || \
            { echo "Error: JS SDK file not found after copy"; exit 1; }
          find Sources/Hackle/Resources -name "hackle-javascript-sdk-*.min.js" \
            ! -name "hackle-javascript-sdk-${JS_SDK_VERSION}.min.js" -delete

      - name: Update source references
        run: |
          sed -i -E "s/(static let javascriptSdkVersion = \")[^\"]+\"/\1${JS_SDK_VERSION}\"/" \
            Sources/Hackle/UI/InAppMessageUI/Views/Html/InAppMessageUIHtmlViewBridgeScript.swift

          sed -i -E "s/\.process\(\"Resources\/hackle-javascript-sdk-[^\"]+\.min\.js\"\)/.process(\"Resources\/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js\")/" \
            Package.swift

          sed -i -E "s/hackle-javascript-sdk-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\.min\.js/hackle-javascript-sdk-${JS_SDK_VERSION}.min.js/g" \
            Tests/HackleTests/UI/InAppMessageUI/Views/WebViewResourceLoaderSpecs.swift

      - name: Verify no stale JS SDK references
        run: |
          if grep -E "hackle-javascript-sdk-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\.min\.js" \
               Package.swift | grep -v "hackle-javascript-sdk-${JS_SDK_VERSION}.min.js"; then
            echo "Error: stale JS SDK references remain in Package.swift"
            exit 1
          fi
          if grep -E "hackle-javascript-sdk-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\.min\.js" \
               Tests/HackleTests/UI/InAppMessageUI/Views/WebViewResourceLoaderSpecs.swift \
               | grep -v "hackle-javascript-sdk-${JS_SDK_VERSION}.min.js"; then
            echo "Error: stale JS SDK references remain in WebViewResourceLoaderSpecs.swift"
            exit 1
          fi
          if grep -E "javascriptSdkVersion = \"[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\"" \
               Sources/Hackle/UI/InAppMessageUI/Views/Html/InAppMessageUIHtmlViewBridgeScript.swift \
               | grep -v "javascriptSdkVersion = \"${JS_SDK_VERSION}\""; then
            echo "Error: stale javascriptSdkVersion remains in InAppMessageUIHtmlViewBridgeScript.swift"
            exit 1
          fi

      - name: Commit and push
        run: |
          FEATURE_BRANCH="update-javascript-sdk-$JS_SDK_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$FEATURE_BRANCH"
          git add \
            Sources/Hackle/Resources/ \
            Sources/Hackle/UI/InAppMessageUI/Views/Html/InAppMessageUIHtmlViewBridgeScript.swift \
            Package.swift \
            Tests/HackleTests/UI/InAppMessageUI/Views/WebViewResourceLoaderSpecs.swift
          git commit -m "chore: update @hackler/javascript-sdk@$JS_SDK_VERSION"
          git push origin "$FEATURE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_BRANCH: ${{ needs.prepare-dev-branch.outputs.branch_name }}
        run: |
          gh pr create \
            --base "$DEV_BRANCH" \
            --title "[Automation] Update @hackler/javascript-sdk@$JS_SDK_VERSION" \
            --body "## Description
          - Update @hackler/javascript-sdk@$JS_SDK_VERSION"
