name: Auto Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Matches x.y.z format

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch full history for release notes

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "version=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify Versions
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          
          # SdkVersion.swift 버전 추출
          PACKAGE_VERSION=$(grep -E 'static let CURRENT = ' Sources/Hackle/Core/Utilities/SdkVersion.swift | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          
          # 버전 비교
          if [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "Versions match"
            exit 0
          else
            echo "Error: Version mismatch detected!"
            echo "Tag version: $TAG_VERSION"
            echo "Package version: $PACKAGE_VERSION"
            echo "Ensure that the tag version matches SdkVersion.swift"
            exit 1
          fi

      - name: Generate Release Notes
        id: generate_notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.version.outputs.version }}'
            });
            core.setOutput('changelog', data.body);

      - name: Create Release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.generate_notes.outputs.changelog }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.VERSION,
              name: process.env.VERSION,
              body: process.env.CHANGELOG,
              draft: false,
              prerelease: false
            });

  notify_release:
    needs: create_release
    uses: ./.github/workflows/notify_release.yml
    secrets: inherit
