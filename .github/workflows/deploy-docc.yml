name: Deploy DocC Documentation

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      - name: Build DocC Documentation
        run: |
          xcodebuild docbuild -project Hackle.xcodeproj \
            -scheme Hackle-Package -configuration "Release" \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=iOS'
      
      - name: Verify DocC Archives
        run: |
          for archive in Hackle HackleNotificationService; do
            if [[ ! -d "/tmp/docbuild/Build/Products/Release-iphoneos/$archive.doccarchive" ]]; then
              echo "::error::$archive.doccarchive not found"
              exit 1
            fi
          done

      - name: Process DocC Archive for Static Hosting
        run: |
          $(xcrun --find docc) process-archive \
          transform-for-static-hosting /tmp/docbuild/Build/Products/Release-iphoneos/Hackle.doccarchive \
          --hosting-base-path hackle-ios-sdk \
          --output-path docs

      - name: Process HackleNotificationService DocC Archive for Static Hosting
        run: |
          $(xcrun --find docc) process-archive \
          transform-for-static-hosting /tmp/docbuild/Build/Products/Release-iphoneos/HackleNotificationService.doccarchive \
          --hosting-base-path hackle-ios-sdk/notification-service \
          --output-path docs/notification-service
      
      - name: Create Index HTML for Auto-redirect
        run: |
          echo "<script>window.location.href += \"/documentation/hackle\"</script>" > docs/index.html
          
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
